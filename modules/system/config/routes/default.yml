system_shemas_models:
  path: api/schemas/{resource_type}
  controller: Hospilibre\System\Controllers\CSchemaController::models
  requirements:
    resource_type: '\w+'
  methods: GET
  defaults:
    permission: none
  options:
    description: Get the schema for resource_type
    parameters:
      fieldsets: '\w+'
    accept:
      - application/json

system_shemas_routes:
  path: api/routes/{path}/{method}
  controller: Hospilibre\System\Controllers\CSchemaController::routes
  requirements:
    method: get|post|put|delete|head|options|patch
    path: '\w+'
  methods: GET
  defaults:
    permission: none
  options:
    description: Get routes OAS3 (path encoded in base64)
    accept:
      - application/json

system_bulk_operations:
  path: api/bulkOperations
  controller: Hospilibre\System\Controllers\CBulkController::execute
  methods: POST
  defaults:
    permission: none # take permission of sub route
  options:
    description: Send a set of requests to handle (bulk)
    parameters:
      stopOnFailure: true|false
    accept:
      - application/json
    body:
      required: true
      content-type:
        - application/json

system_history_list:
  path: api/history/{resource_type}/{resource_id}
  controller: Hospilibre\System\Controllers\CHistoryController::list
  methods: GET
  defaults:
    permission: admin
  requirements:
    resource_type: '\w+'
    resource_id: '\d+'
  options:
    description: List resource history
    accept:
      - application/json

system_history_show:
  path: api/history/{resource_type}/{resource_id}/{history_id}
  controller: Hospilibre\System\Controllers\CHistoryController::show
  methods: GET
  defaults:
    permission: admin
  requirements:
    resource_type: '\w+'
    resource_id: '\d+'
    history_id: '\d+'
  options:
    description: Show  resource history
    parameters:
      loadResource: true|false
    accept:
      - application/json

system_locales:
  path: api/locales/{language}/{mod_name}
  controller: Hospilibre\System\Controllers\CLocalesController::listLocales
  methods: GET
  defaults:
    permission: none
  requirements:
    language: fr|en|it|de|fr-be|nl-be
    mod_name: '\w+'
  options:
    description: List locales by module
    accept:
      - application/json
    parameters:
      search: '\w+'
      search_mode: starts_with|ends_with|contains|equal
      search_in: key|value

system_preferences:
  path: api/preferences/{mod_name}
  controller: Hospilibre\System\Controllers\CPreferencesController::listPreferences
  methods: GET
  defaults:
    permission: none
  requirements:
    mod_name: '\w+'
  options:
    description: List default preferences for module
    accept:
      - application/json
    parameters:
      search: '\w+'

system_user_preferences:
  path: api/preferences/{mod_name}/{user_id}
  controller: Hospilibre\System\Controllers\CPreferencesController::listUserPreferences
  methods: GET
  defaults:
    permission: read
  requirements:
    user_id: '\d+'
    mod_name: '\w+'
  options:
    description: List user preferences for module
    accept:
      - application/json
    parameters:
      search: '\w+'

system_preferences_set:
  path: api/preferences/{user_id}
  controller: Hospilibre\System\Controllers\CPreferencesController::setPreferences
  methods: POST
  defaults:
    permission: none
  requirements:
    user_id: '\d*'
  options:
    description: Set user or default preferences
    parameters:
      restricted: true|false
    accept:
      - application/json
    responses:
      201: The response's body contains the setted preferences in json_api format.
      default: 403, 404 or 500 on error.
    body:
      required: true
      content-type:
        - application/json

system_preferences_delete:
  path: api/preferences/{user_id}
  controller: Hospilibre\System\Controllers\CPreferencesController::deletePreferences
  methods: DELETE
  defaults:
    permission: none
  requirements:
    user_id: '\d*'
  options:
    description: Delete user preferences
    parameters:
        restricted: true|false
    accept:
      - application/json
    responses:
      204: The preferences have been deleted.
      default: 403, 404 or 500 on error.
    body:
      required: true
      content-type:
        - application/json

system_configs_instance:
  path: api/configurations/{mod_name}
  controller: Hospilibre\System\Controllers\CConfigurationController::listConfigurations
  methods: GET
  defaults:
    permission: none
  requirements:
    mod_name: '\w+'
  options:
    description: List all configurations for a module
    accept:
      - application/json
    parameters:
      search: '\w+'

system_set_configs:
  path: api/configurations
  controller: Hospilibre\System\Controllers\CConfigurationController::setConfigurations
  methods: PUT
  defaults:
    permission: admin
  options:
    description: Set configurations
    accept:
      - application/json
    parameters:
      context: '^(\w+\-\d+|global|static)$'
    body:
      required: true
      content-type:
        - application/json

system_get_configs:
  path: api/configurations
  controller: Hospilibre\System\Controllers\CConfigurationController::getConfigurations
  methods: GET
  defaults:
    permission: none
  options:
    description: Get configurations which paths are specified in the request body
    accept:
      - application/json
    parameters:
      context: '^(\w+\-\d+|global|static)$'
    body:
      required: true
      content-type:
        - application/json

system_api_status:
  path: api/status
  controller: Hospilibre\System\Controllers\CSystemController::status
  methods: GET
  defaults:
    permission: none
    public: true
  options:
    description: Api status
    accept:
      - application/json

system_api_tags:
  path: /api/tag
  controller: Hospilibre\System\Controllers\CTagController::listTags
  methods: GET
  defaults:
    permission: read
  options:
    description: Return a list of tags
    parameters:
    body:
      required: false
      content-type: [form-data]

system_api_tag:
  path: /api/tag/{tag_id}
  controller: Hospilibre\System\Controllers\CTagController::showTag
  methods: GET
  requirements:
    tag_id: '\d+'
  defaults:
    permission: read
  options:
    description: Return a tag data
    parameters:
    body:
      required: false
      content-type: [form-data]
