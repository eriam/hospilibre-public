# @link https://symfony.com/doc/current/service_container.html
# @link https://symfony.com/doc/current/service_container/calls.html
services:
  # Declare all the classes in the namespace Hospilibre\Sample\Repositories as services.
  # All the repositories inherit the configuration from their parent Ox\Core\Repositories\AbstractRepository.
  # The parent add the call to the method initFromRequest when the repository is autowired.
  Hospilibre\Sample\Repositories\:
    resource: '../../classes/Repositories/*'
    parent: Ox\Core\Repositories\AbstractRepository
