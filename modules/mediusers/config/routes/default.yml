mediuser_mediusers:
  path: /api/mediuser/mediusers
  controller: Hospilibre\Mediusers\Controllers\CMediusersController::listMediusers
  methods: GET
  defaults:
    permission: read
  options:
    description: Return a list of mediusers
    parameters:
      type: prat|anesth
      name: '\w+'
    accept:
      - application/json

mediuser_mediusers_import:
  path: /api/mediuser/mediusers
  controller: Hospilibre\Mediusers\Controllers\CMediusersController::importMediusers
  methods: POST
  defaults:
    permission: edit
  options:
    description: Create or update mediusers using a CSV file uploaded with the name import_file
    accept:
      - application/json
    body:
      required: true
      content-type:
        - multipart/form-data
    parameters:
      update_found_users: bool
      dry_run: bool
    responses:
      default: 'A successfull response will contains the attributes "created" (messages for created users), "found" (messages for already existing users) and "errors" (errors that happened prefixed with the line number)'
      200: 'Ok no creation'
      201: 'Ok one or more creations'

mediuser_mediuser:
  path: /api/mediuser/mediusers/{user_id}
  controller: Hospilibre\Mediusers\Controllers\CMediusersController::showMediuser
  methods: GET
  defaults:
    permission: read
  requirements:
    user_id: '\d+'
  options:
    description: Return a mediuser
    accept:
      - application/json

mediuser_mediuser_by_rpps:
  path: /api/mediuser/mediuser_by_rpps/{rpps}
  controller: Hospilibre\Mediusers\Controllers\CMediusersController::showMediuserByRPPS
  requirements:
    rpps: '\w+'
  methods: GET
  defaults:
    permission: read
  options:
    description: Return a mediuser by rpps
    accept:
      - application/json

mediuser_mediuser_functions:
  path: /api/mediuser/mediusers/{user_id}/functions
  controller: Hospilibre\Mediusers\Controllers\CMediusersController::listFunctions
  methods: GET
  defaults:
    permission: read
  requirements:
    user_id: '\d+'
  options:
    description: Return a list of functions
    accept:
      - application/json

mediuser_mediuser_hit_list:
  path: api/mediuser/mediusers/{user_id}/hits
  controller: Hospilibre\Mediusers\Controllers\CMediusersController::listHits
  methods: GET
  defaults:
    permission: read
  requirements:
    user_id: '\d+'
  options:
    description: List the 4 most called tabs for the user
    accept:
      - application/json
